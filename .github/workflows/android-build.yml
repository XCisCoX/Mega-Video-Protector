name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android arm64-v8a APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK (cmdline-tools on PATH)
        uses: android-actions/setup-android@v3

      - name: Install SDK packages + host tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;30.0.14904198" \
            "cmake;3.22.1" >/dev/null
          sudo apt-get update -qq
          # qemu-user lets the core script's aarch64 test loop actually run
          # (the script auto-installs it, but needs root for apt).
          sudo apt-get install -y -qq make tcl qemu-user

      - name: Build Android core (deps + static libs + aarch64 tests)
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/30.0.14904198"
          bash scripts/android/build-android-core.sh

      - name: Build debug APK
        env:
          MVP_ANDROID_PREFIX: "${{ github.workspace }}/out/android-arm64/prefix"
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaVideoProtect-native-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Summarize
        run: |
          ls -la android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | \
            grep -E "libmvpcore|classes.dex" || true
